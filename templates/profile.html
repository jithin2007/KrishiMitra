{% extends "base.html" %}
{% block title %}Profile — KrishiMitra{% endblock %}
{% block content %}

<div class="topbar">
    <h1 class="greeting">My Profile</h1>
</div>

<div class="card" style="max-width: 560px;">
    <form method="POST">
        <div class="field">
            <label>Email</label>
            <input type="email" value="{{ farmer.email }}" disabled>
            <span class="hint">Email cannot be changed.</span>
        </div>
        <div class="field">
            <label>Phone</label>
            <input type="text" value="{{ farmer.phone }}" disabled>
        </div>
        <div class="field">
            <label for="full_name">Full name <span class="req">*</span></label>
            <input type="text" id="full_name" name="full_name" value="{{ farmer.full_name }}" required>
        </div>
        <div class="form-grid">
            <div class="field"><label for="state">State</label><input type="text" id="state" name="state" value="{{ farmer.state or '' }}"></div>
            <div class="field"><label for="district">District</label><input type="text" id="district" name="district" value="{{ farmer.district or '' }}"></div>
        </div>
        <div class="field">
            <label>Member since</label>
            <input type="text" value="{{ farmer.created_at.strftime('%d %b %Y') if farmer.created_at }}" disabled>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>

{% endblock %}
