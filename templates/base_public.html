<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}KrishiMitra — Better Decisions. Better Harvests.{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
<link rel="icon" type="image/png" sizes="256x256" href="{{ url_for('static', filename='images/favicon-256.png') }}">
{% block head %}{% endblock %}
</head>
<body>
<div id="toast-stack"></div>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div id="flash-data" style="display:none;">
        {% for category, message in messages %}
            <div data-category="{{ category }}">{{ message }}</div>
        {% endfor %}
        </div>
    {% endif %}
{% endwith %}
{% block body %}{% endblock %}
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
